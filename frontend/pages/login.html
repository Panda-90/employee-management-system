<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Employee Management</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Auth Script -->
    <script src="../js/auth.js"></script>
    
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #172b42 0%, #2875df 100%);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-size: 50px;
            color: #2875df;
            margin-bottom: 10px;
        }

        .login-card h2 {
            margin-bottom: 5px;
            color: #172033;
        }

        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-form .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .login-form .input-box {
            height: 45px;
        }
        
        .login-form .input-box input {
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            height: 45px;
            background: #2875df;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1768d4;
        }
        
        #errorMessage {
            color: #ee4050;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            
            <i class="fa-solid fa-users login-logo"></i>
            <h2>Welcome Back</h2>
            <p>Sign in to the Admin Dashboard</p>
            
            <form id="loginForm" class="login-form">
                
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div id="errorMessage">Invalid credentials. Please try again.</div>
                
            </form>
            
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
